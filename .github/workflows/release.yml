name: Release

# 正式版：推 v* tag（例如 v1.0）时构建并发布带版本号的 GitHub Release。
# 同时清理早期滚动发布的 latest release/tag —— 首页的 /releases/latest 会自动
# 指向最新的正式版（预发布版不算 latest）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（例如 v1.0），必须与当前提交对应"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-clients.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag 必须以 v 开头：$tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 一次性迁移：删掉旧的 latest release 与它的 tag，之后只保留版本号 + beta
      - name: Remove legacy latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "已删除 latest release 及其 tag"
          else
            echo "没有 latest release，跳过"
          fi

      - name: Publish ${{ steps.version.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CertumSigner ${{ steps.version.outputs.tag }}
          make_latest: true
          body: |
            CertumSigner ${{ steps.version.outputs.tag }} — 由 GitHub Actions 从
            `${{ github.sha }}` 构建。

            | 平台 | 架构 | 形式 |
            | --- | --- | --- |
            | Windows | x64 / arm64 | GUI（Win32 自绘）、CLI |
            | Linux | x64 / arm64 | GUI（GTK3）、CLI |

            - Windows 产物用 vcpkg 静态链接 OpenSSL，解压即用，无需额外运行库。
            - CLI 版不含 Win32 / GTK 界面；同一个可执行文件加 `--gui` 也能开界面（GUI 版）。
            - 客户端用法见包内 `README-client.md` 或仓库 [client/README.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/client/README.md)。
            - 想看每次客户端改动的最新构建：见 [`beta`](https://github.com/${{ github.repository }}/releases/tag/beta) 预发布。
          files: dist/*
          fail_on_unmatched_files: true
