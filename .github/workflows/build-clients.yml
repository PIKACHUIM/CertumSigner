name: Build clients

# 可复用的构建流程：Windows / Linux × x64 / arm64 的 GUI 与 CLI。
# 由 release.yml（打 v* tag）和 beta.yml（改客户端后自动构建）调用，
# 产物只在同一次 run 内共享，发布由调用方负责。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.family }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            family: windows
            arch: x64
            triplet: x64-windows-static-md
          # 在 x64 主机上交叉编译 arm64（vcpkg 原生支持该 triplet）
          - os: windows-latest
            family: windows
            arch: arm64
            triplet: arm64-windows-static-md
          - os: ubuntu-24.04
            family: linux
            arch: x64
          - os: ubuntu-24.04-arm
            family: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev libgtk-3-dev

      - name: Set up vcpkg
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path (Join-Path $root 'vcpkg.exe'))) {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            if (-not (Test-Path (Join-Path $root 'vcpkg.exe'))) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
              & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
            }
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install OpenSSL (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install "openssl:${{ matrix.triplet }}" --clean-after-build

      - name: Build GUI (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          cmake -B build-gui -S client -A ${{ matrix.arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCS_BUILD_GUI=ON
          cmake --build build-gui --config Release --parallel

      - name: Build CLI (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          cmake -B build-cli -S client -A ${{ matrix.arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCS_BUILD_GUI=OFF
          cmake --build build-cli --config Release --parallel

      # Windows 先在矩阵里只产出裸 exe，签名与打包留给 sign-windows 任务：
      # arm64 的 exe 在 x64 runner 上跑不起来，必须用 x64 的 CLI 去签它。
      - name: Stage executables (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          Copy-Item "build-gui/Release/certumsigner.exe" "certumsigner-gui.exe"
          Copy-Item "build-cli/Release/certumsigner.exe" "certumsigner-cli.exe"
      - name: Upload raw executables (Windows)
        if: matrix.family == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: win-exe-${{ matrix.arch }}
          path: |
            certumsigner-gui.exe
            certumsigner-cli.exe
          if-no-files-found: error

      - name: Build GUI (Linux)
        if: matrix.family == 'linux'
        run: |
          cmake -B build-gui -S client -DCMAKE_BUILD_TYPE=Release -DCS_BUILD_GUI=ON
          cmake --build build-gui --parallel

      - name: Build CLI (Linux)
        if: matrix.family == 'linux'
        run: |
          cmake -B build-cli -S client -DCMAKE_BUILD_TYPE=Release -DCS_BUILD_GUI=OFF
          cmake --build build-cli --parallel

      - name: Package (Linux)
        if: matrix.family == 'linux'
        run: |
          set -euo pipefail
          for form in gui cli; do
            stage="stage-$form"
            mkdir -p "$stage"
            cp "build-$form/certumsigner" "$stage/certumsigner"
            strip "$stage/certumsigner" || true
            cp LICENSE "$stage/LICENSE"
            cp client/README.md "$stage/README-client.md"
            tar -czf "certumsigner-linux-${{ matrix.arch }}-$form.tar.gz" -C "$stage" certumsigner LICENSE README-client.md
          done

      - name: Upload artifacts (Linux)
        if: matrix.family == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.family }}-${{ matrix.arch }}
          path: |
            certumsigner-*.tar.gz
          if-no-files-found: error

  # Windows 的签名与打包：用 x64 的 CLI（本项目自己）给两个架构的 exe 加 Certum 云签名。
  # 需要仓库 Secret：CERTUM_SIGNER_SERVER、CERTUM_SIGNER_API_KEY（绑定 Finnox 证书的 Key）。
  sign-windows:
    name: sign-windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          pattern: win-exe-*
          path: raw

      - name: Sign with Certum certificate
        shell: pwsh
        env:
          CERTUM_SIGNER_SERVER: ${{ secrets.CERTUM_SIGNER_SERVER }}
          CERTUM_SIGNER_API_KEY: ${{ secrets.CERTUM_SIGNER_API_KEY }}
        run: |
          # Actions 日志要登录才能看，注解（annotation）是公开可读的，所以失败原因同时写成 ::error::
          function ConvertTo-Annotation([string]$text) {
            $escaped = $text -replace "`r`n", "%0A" -replace "`n", "%0A" -replace "`r", "%0A"
            if ($escaped.Length -gt 12000) { $escaped = $escaped.Substring(0, 12000) + "…" }
            return $escaped
          }

          $server = $env:CERTUM_SIGNER_SERVER
          $key = $env:CERTUM_SIGNER_API_KEY
          $exes = @(Get-ChildItem -Path raw -Recurse -Filter *.exe | Sort-Object FullName)
          if ($exes.Count -eq 0) { throw "没有找到待签名的可执行文件" }

          if (-not $server -or -not $key) {
            Write-Host "::error::缺少仓库 Secret：CERTUM_SIGNER_SERVER=$([bool]$server) CERTUM_SIGNER_API_KEY=$([bool]$key)"
            # beta 是分支 push，允许先出未签名产物；正式版（tag push / 手动 dispatch）必须签名
            $isRelease = "${{ github.event_name }}" -ne "push" -or "${{ github.ref }}".StartsWith("refs/tags/")
            if ($isRelease) {
              throw "缺少 CERTUM_SIGNER_SERVER / CERTUM_SIGNER_API_KEY 仓库 Secret：正式版必须用 Finnox 证书签名"
            }
            Write-Warning "未配置签名 Secret，本次 Windows 产物未签名（仅允许 beta 这样）"
            exit 0
          }
          Write-Host "签名服务：$server（API Key 长度 $(($key.Trim()).Length)）"

          # 用 x64 的 CLI 签所有架构；先复制到临时目录，避免改正在运行的 exe
          $host_cli = (Get-ChildItem -Path raw -Recurse -Filter certumsigner-cli.exe |
            Where-Object { $_.FullName -match 'win-exe-x64' } | Select-Object -First 1).FullName
          if (-not $host_cli) { throw "找不到 x64 的 certumsigner-cli.exe，无法签名" }
          $signer = Join-Path $env:RUNNER_TEMP "certumsigner-signer.exe"
          Copy-Item $host_cli $signer -Force

          # 先取一次证书，把鉴权/证书分配的问题与签名问题分开
          $certOut = (& $signer cert 2>&1 | Out-String)
          $certCode = $LASTEXITCODE
          Write-Host $certOut
          if ($certCode -ne 0) {
            Write-Host ("::error::获取签名证书失败（exit $certCode）：" + (ConvertTo-Annotation $certOut))
            throw "获取签名证书失败（exit $certCode）"
          }

          foreach ($exe in $exes) {
            Write-Host "== 签名 $($exe.FullName)"
            $signOut = (& $signer sign $exe.FullName --yes 2>&1 | Out-String)
            $signCode = $LASTEXITCODE
            Write-Host $signOut
            if ($signCode -ne 0) {
              Write-Host ("::error::签名失败（exit $signCode）$($exe.Name)：" + (ConvertTo-Annotation $signOut))
              throw "签名失败：$($exe.FullName)"
            }
            $verifyOut = (& $signer verify $exe.FullName 2>&1 | Out-String)
            $verifyCode = $LASTEXITCODE
            Write-Host $verifyOut
            if ($verifyCode -ne 0) {
              Write-Host ("::error::签名校验失败（exit $verifyCode）$($exe.Name)：" + (ConvertTo-Annotation $verifyOut))
              throw "签名校验失败：$($exe.FullName)"
            }
          }

      - name: Package (Windows)
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            foreach ($form in @('gui', 'cli')) {
              $stage = "stage-$arch-$form"
              New-Item -ItemType Directory -Force -Path $stage | Out-Null
              Copy-Item "raw/win-exe-$arch/certumsigner-$form.exe" "$stage/certumsigner.exe"
              Copy-Item "LICENSE" "$stage/LICENSE.txt"
              Copy-Item "client/README.md" "$stage/README-client.md"
              Compress-Archive -Path "$stage/*" -DestinationPath "certumsigner-windows-$arch-$form.zip" -Force
            }
          }

      - name: Upload artifacts (Windows x64)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: certumsigner-windows-x64-*.zip
          if-no-files-found: error

      - name: Upload artifacts (Windows arm64)
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: certumsigner-windows-arm64-*.zip
          if-no-files-found: error

